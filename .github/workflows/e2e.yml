name: End to end

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ui:
    name: Drive the UI against a real RomM
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Start RomM
        run: docker compose -f test/e2e/compose.yml up -d --wait db romm

      - name: Run
        run: |
          mkdir -p test/e2e/screenshots
          docker compose -f test/e2e/compose.yml run --rm --build tests \
            go test -tags=e2e -count=1 -v -timeout 30m ./...

      # Worth keeping whether or not it passed: on a failure they show what
      # was on screen, and on a pass they show what every firmware looks like.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: test/e2e/screenshots/
          retention-days: 14

      - name: RomM logs
        if: failure()
        run: docker compose -f test/e2e/compose.yml logs romm --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f test/e2e/compose.yml down -v --remove-orphans
