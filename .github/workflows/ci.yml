name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # go.work points at a sibling gabagool checkout that only exists on a
  # developer's machine. CI builds against the pinned module version.
  GOWORK: "off"

jobs:
  # Structure checks resolve the import graph without compiling anything, so
  # they need no SDL toolchain and report in seconds. Kept separate from the
  # test job for exactly that reason.
  structure:
    name: Structure
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendored/' | grep -v '^site/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: Package layering
        run: go run ./tools/archcheck -v

      - name: Firmware matrix is current
        run: go run ./tools/gen-firmware-matrix -check

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # grout links SDL through the gabagool UI toolkit.
      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libsdl2-ttf-dev libsdl2-gfx-dev libsdl2-image-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -cover

  # A refactor that compiles on amd64 can still break a device target, and
  # every device grout runs on is arm.
  #
  # Only packages that build without cgo can be checked here; anything reaching
  # the UI toolkit needs SDL headers for the target architecture, which is what
  # the Docker build is for.
  cross-compile:
    name: Cross-compile (arm64)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet arm64 packages
        run: |
          go vet \
            ./core/... \
            ./cli/... \
            ./cmd/... \
            ./version \
            ./resources \
            ./tools/archcheck \
            ./tools/gen-firmware-matrix

  libgrout:
    name: Build libgrout
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test
        run: scripts/libgrout-smoke.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linux arm64
        run: task libgrout:linux-arm64

      - name: Build linux arm
        run: task libgrout:linux-arm32

      - name: Build android
        run: task libgrout:android

      - name: Check outputs
        run: |
          for dir in linux-arm64 linux-arm android/arm64-v8a android/armeabi-v7a; do
            for f in libgrout.so libgrout.h; do
              if [ ! -s "build/libgrout/$dir/$f" ]; then
                echo "missing build/libgrout/$dir/$f"
                exit 1
              fi
            done
          done
