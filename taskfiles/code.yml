version: '3'

tasks:

  lint:
    desc: Run Go code style checks (fmt, vet, staticcheck)
    cmds:
      - go fmt ./...
      - go vet ./...
      - staticcheck ./...
    silent: true

  gen-platform-docs:
    desc: Regenerate docs/platforms/*.md from the platforms.json files the app reads
    cmds:
      - go run ./tools/gen-platform-docs
    silent: true

  check-platform-docs:
    desc: Fail if docs/platforms/*.md are out of date with platforms.json
    cmds:
      - go run ./tools/gen-platform-docs -check
    silent: true

  hooks-setup:
    desc: Install git hooks for development
    cmds:
      - git config core.hooksPath .githooks
      - echo "Git hooks installed from .githooks/"
    silent: true
