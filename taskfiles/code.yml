version: '3'

tasks:

  lint:
    desc: Run Go code style checks (fmt, vet, staticcheck)
    cmds:
      - go fmt ./...
      - go vet ./...
      - staticcheck ./...
    silent: true

  archcheck:
    desc: Check package layering (imports, UI toolkit, package-level state)
    cmds:
      - go run ./tools/archcheck -v
    silent: true

  archcheck-update:
    desc: Rewrite the archcheck allowlist from the current tree
    cmds:
      - go run ./tools/archcheck -update
    silent: true

  firmware-matrix:
    desc: Regenerate docs/firmware-matrix.md from the firmware definitions
    cmds:
      - go run ./tools/gen-firmware-matrix
    silent: true

  check-firmware-matrix:
    desc: Fail when docs/firmware-matrix.md is stale
    cmds:
      - go run ./tools/gen-firmware-matrix -check
    silent: true

  mkroot:
    desc: Build a mock root for a firmware (pass --firmware <id> <dir>)
    cmds:
      - go run ./tools/mkroot {{.CLI_ARGS}}
    silent: true

  hooks-setup:
    desc: Install git hooks for development
    cmds:
      - git config core.hooksPath .githooks
      - echo "Git hooks installed from .githooks/"
    silent: true
