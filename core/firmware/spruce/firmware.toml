id = "spruce"
name = "Spruce"
maintained = "upstream"
upstream = { repo = "github.com/spruceUI/spruceOS", ref = "v4.6.0" }

[version]
file = { value = "{card}/spruce/spruce", src = "App/PyUI/py-ui-config.json" }

[paths]
card = { value = "/mnt/SDCARD", src = "spruce/scripts/helperFunctions.sh" }
roms = { value = "{card}/Roms", src = "App/PyUI/main-ui/games/utils/device_specific/miyoo_trim_game_system_utils.py" }
bios = { value = "{card}/BIOS", src = "RetroArch/platform/retroarch-MiyooMini.cfg.bak" }
saves = { value = "{card}/Saves/saves", src = "RetroArch/platform/retroarch-MiyooMini.cfg.bak" }

[rom_folders]
style = { value = "plain", src = "App/PyUI/main-ui/games/utils/rom_utils.py" }

[saves]
layout = { value = "per-emulator", src = "RetroArch/platform/retroarch-MiyooMini.cfg.bak" }
naming = { value = "retroarch", src = "RetroArch/platform/retroarch-MiyooMini.cfg.bak" }
extra_folders_hook = "spruce_arch_saves"

[bios]
default = { value = ["{bios}/{rel}"], src = "RetroArch/platform/retroarch-MiyooMini.cfg.bak" }

[art]
naming = "plain"
cover = { value = "{rom_dir}/Imgs", src = "App/PyUI/main-ui/menus/games/utils/rom_select_options_builder.py" }

[gamelist]
format = "miyoo"

[platform_sources]
roms = "Roms"
saves = "spruce/scripts/emu/lib/core_mappings.sh"

[platforms]
acpc = { roms = ["CPC"], saves = ["Caprice32", "CrocoDS"] }
amiga = { roms = ["AMIGA"], saves = ["UAE4ARM", "PUAE 2021"] }
