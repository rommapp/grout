videopac-g7400 = { roms = ["VIDEOPAC"], saves = ["O2EM"] }
virtualboy = { roms = ["VB"], saves = ["Beetle VB"] }
wonderswan = { roms = ["WS"], saves = ["Beetle WonderSwan"] }
wonderswan-color = { roms = ["WSC"], saves = ["Beetle WonderSwan"] }
zxs = { roms = ["ZXS"], saves = ["Fuse"] }

[devices]
default = "generic"
rules = [
  { device = "a30", env = "SPRUCE_DEVICE", equals = "A30" },
  { device = "miyoomini", env = "SPRUCE_DEVICE", equals = "MIYOOMINI" },
  { device = "miyooflip", env = "SPRUCE_DEVICE", equals = "MIYOOFLIP" },
  { device = "trimui", env = "SPRUCE_DEVICE", equals = "TRIMUI" },
  { device = "pixel", env = "SPRUCE_DEVICE", equals = "PIXEL" },
  { device = "h700", env = "SPRUCE_DEVICE", equals = "H700" },
]

[devices.inputs]
miyoomini = "miyoo.json"
a30 = "a30.json"
pixel = "gkd_pixel_2.json"
h700 = "h700.json"

[devices.quirks]
a30 = { rotation = 270 }

[packaging]
asset = "Grout.spruce.zip"
launch_script = "Grout/launch.sh"
install_depth = 3
files = ["launch.sh", "config.json", "grout.png"]
