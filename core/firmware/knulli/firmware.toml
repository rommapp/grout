id = "knulli"
name = "Knulli"
maintained = "upstream"
upstream = { repo = "github.com/knulli-cfw/knulli-linux", ref = "20260511" }

[version]
file = { value = "/usr/share/knulli/knulli.version", src = "package/system/knulli-system/knulli-system.mk" }

[paths]
card = { value = "/userdata", src = "package/system/knulli-configgen/configgen/configgen/batoceraPaths.py" }
roms = { value = "{card}/roms", src = "package/system/knulli-configgen/configgen/configgen/batoceraPaths.py" }
bios = { value = "{card}/bios", src = "package/system/knulli-configgen/configgen/configgen/batoceraPaths.py" }
saves = { value = "{card}/saves", src = "package/system/knulli-configgen/configgen/configgen/batoceraPaths.py" }

[rom_folders]
style = { value = "plain", src = "package/emulationstation/knulli-es-system/knulli-es-system.py" }

[saves]
layout = { value = "per-emulator", src = "package/system/knulli-configgen/configgen/configgen/generators/libretro/libretroConfig.py" }
naming = { value = "retroarch", src = "package/system/knulli-configgen/configgen/configgen/generators/libretro/libretroConfig.py" }

[bios]
default = { value = ["{bios}/{rel}"], src = "package/system/knulli-configgen/configgen/configgen/generators/libretro/libretroRetroarchCustom.py" }

[art]
naming = "es-suffix"
cover = { value = "{rom_dir}/images", src = "package/emulationstation/knulli-es-system/roms/gba/gamelist.xml" }
video = { value = "{rom_dir}/videos", src = "package/emulationstation/knulli-es-system/roms/gba/gamelist.xml" }
manual = { value = "{rom_dir}/manuals", src = "board/fsoverlay/usr/share/emulationstation/hooks/preupdate-gamelists-scummvm.sh" }
marquee = { value = "{rom_dir}/images", src = "package/emulationstation/knulli-es-system/roms/gba/gamelist.xml" }
thumbnail = { value = "{rom_dir}/images", src = "board/fsoverlay/usr/share/knulli/datainit/roms/emulators/gamelist.xml" }

[gamelist]
format = "emulationstation"
launcher_entry = { gamelist = "{roms}/tools/gamelist.xml", path = "./Grout/Grout.sh" }

[retroarch]
config = { value = "{card}/system/configs/retroarch/retroarchcustom.cfg", src = "package/system/knulli-configgen/configgen/configgen/generators/libretro/libretroPaths.py" }
overrides = { value = "{card}/system/configs/retroarch", src = "package/system/knulli-configgen/configgen/configgen/generators/libretro/libretroGenerator.py" }

[platform_sources]
roms = "package/emulationstation/knulli-es-system/es_systems.yml"
saves = "package/system/knulli-configgen/configgen/configgen/generators/libretro/libretroConfig.py"

[platforms]
"3do" = { roms = ["3do"], saves = ["3do"] }
"3ds" = { roms = ["3ds"], saves = ["3ds"] }
acpc = { roms = ["amstradcpc"], saves = ["amstradcpc"] }
amiga = { roms = ["amiga500", "amiga1200"], saves = ["amiga500", "amiga1200"] }
arcade = { roms = ["mame", "fbneo", "neogeo"], saves = ["mame", "fbneo", "neogeo"] }
arduboy = { roms = ["arduboy"], saves = ["arduboy"] }
