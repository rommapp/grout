id = "rocknix"
name = "ROCKNIX"
maintained = "upstream"
upstream = { repo = "github.com/ROCKNIX/distribution", ref = "20261101" }

[version]
file = { value = "/etc/release", src = "scripts/image" }

[paths]
card = { value = "/storage", src = "projects/ROCKNIX/packages/ui/emulationstation/system.d/emustation.service" }
roms = { value = "{card}/roms", src = "projects/ROCKNIX/packages/virtual/emulators/tmpfiles.d/rocknix-dirs.conf" }
bios = { value = "{roms}/bios", src = "projects/ROCKNIX/packages/emulators/libretro/retroarch/sources/RK3566/retroarch.cfg" }
saves = { value = "{roms}", src = "projects/ROCKNIX/packages/emulators/libretro/retroarch/sources/RK3566/retroarch.cfg" }

[rom_folders]
style = { value = "plain", src = "config/emulators/gba.conf" }

[saves]
layout = { value = "beside-roms", src = "projects/ROCKNIX/packages/emulators/libretro/retroarch/sources/RK3566/retroarch.cfg" }
naming = { value = "retroarch", src = "projects/ROCKNIX/packages/emulators/libretro/retroarch/sources/RK3566/retroarch.cfg" }

[bios]
default = { value = ["{bios}/{rel}"], src = "projects/ROCKNIX/packages/emulators/libretro/retroarch/sources/RK3566/retroarch.cfg" }

[art]
naming = "es-suffix"
cover = { value = "{rom_dir}/images", src = "projects/ROCKNIX/packages/misc/modules/sources/gamelist.xml" }

[gamelist]
format = "emulationstation"
launcher_entry = { gamelist = "{roms}/ports/gamelist.xml", path = "./Grout.sh" }

[[exit_actions]]
when = "gamelist_changed"
command = { value = ["killall", "emulationstation"], src = "projects/ROCKNIX/packages/emulators/standalone/vita3k-sa/scripts/start_vita3k.sh" }

[retroarch]
config = { value = "{card}/.config/retroarch/retroarch.cfg", src = "projects/ROCKNIX/packages/rocknix/sources/scripts/setsettings.sh" }
overrides = { value = "{card}/.config/retroarch/config", src = "projects/ROCKNIX/packages/emulators/libretro/retroarch/sources/RK3566/retroarch.cfg" }

[platform_sources]
roms = "config/emulators"

