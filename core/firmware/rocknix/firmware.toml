[devices]
default = "generic"
rules = [
  { device = "rgds", file = "/sys/firmware/devicetree/base/compatible", contains = "anbernic,rg-ds" },
]

[devices.inputs]
rgds = "rgds.json"

[packaging]
asset = "Grout-ROCKNIX.zip"
launch_script = "Grout.sh"
install_depth = 2
files = ["Grout.sh", "logo.png"]
