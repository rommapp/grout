id = "leaf"
name = "Leaf"
maintained = "upstream"
upstream = { repo = "github.com/Utility-Muffin-Research-Kitchen/Leaf", ref = "v0.14.0" }

[paths]
card = { hook = "leaf_card_root" }
roms = { value = "{card}/Roms", src = "stage/mlp1.mk" }
bios = { value = "{card}/BIOS", src = "stage/mlp1.mk" }
saves = { value = "{card}/Saves", src = "stage/mlp1.mk" }

[rom_folders]
style = { value = "plain", src = "config/retroarch/mlp1/systems.json" }

[saves]
layout = { value = "per-emulator", src = "scripts/retroarch_generate_metadata.py" }
naming = { value = "retroarch", src = "config/retroarch/mlp1/cores.json" }

[bios]
default = { value = ["{bios}/{rel}"], src = "config/retroarch/mlp1/systems.json" }

[art]
naming = "plain"
cover = { value = "{card}/Images/{rom_folder}", src = "config/retroarch/mlp1/systems.json" }

[gamelist]
format = "none"

[platform_sources]
roms = "config/retroarch/mlp1/systems.json"
saves = "config/retroarch/mlp1/cores.json"

[platforms]
amiga = { roms = ["AMIGA"], saves = ["PUAE 2021", "PUAE"], bios = ["{bios}/puae/{name}"] }
arcade = { roms = ["ARCADE", "MAME", "MAME2003", "MAME2010"], saves = ["FinalBurn Neo", "MAME 2003-Plus", "FB Alpha 2012", "MAME", "MAME 2010"], bios = ["{bios}/{name}", "{bios}/{rel}"] }
atari2600 = { roms = ["ATARI2600", "A2600"], saves = ["Stella 2014"] }
atari7800 = { roms = ["A7800", "ATARI7800"], saves = ["ProSystem"] }
colecovision = { roms = ["COLECO", "COLECOVISION"], saves = [] }
cps1 = { roms = ["ARCADE"], saves = ["FinalBurn Neo", "MAME 2003-Plus", "FB Alpha 2012"], bios = ["{bios}/{name}", "{bios}/{rel}"] }
cps2 = { roms = ["ARCADE"], saves = ["FinalBurn Neo", "MAME 2003-Plus", "FB Alpha 2012"], bios = ["{bios}/{name}", "{bios}/{rel}"] }
cps3 = { roms = ["ARCADE"], saves = ["FinalBurn Neo", "MAME 2003-Plus", "FB Alpha 2012"], bios = ["{bios}/{name}", "{bios}/{rel}"] }
dc = { roms = ["DC", "DREAMCAST"], saves = ["Flycast", "FlyCast Fast UMRK"] }
dos = { roms = ["DOS"], saves = ["DOSBox-pure"] }
famicom = { roms = ["NES", "FC", "FAMICOM"], saves = ["FCEUmm"] }
fds = { roms = ["FDS"], saves = ["FCEUmm"] }
g-and-w = { roms = ["GW"], saves = ["Game & Watch"] }
gamegear = { roms = ["GG"], saves = ["Genesis Plus GX", "PicoDrive"] }
gb = { roms = ["GB"], saves = ["Gambatte", "mGBA"] }
gba = { roms = ["GBA"], saves = ["mGBA", "gpSP"] }
gbc = { roms = ["GBC"], saves = ["Gambatte", "mGBA"] }
genesis = { roms = ["GENESIS", "MD", "MEGADRIVE"], saves = ["Genesis Plus GX", "PicoDrive"] }
lynx = { roms = ["LYNX"], saves = ["Handy"] }
n64 = { roms = ["N64"], saves = ["Mupen64Plus-Next"] }
nds = { roms = ["NDS"], saves = [], bios = ["{bios}/NDS/{name}"] }
neo-geo-pocket = { roms = ["NGP"], saves = ["Beetle NeoPop"] }
neo-geo-pocket-color = { roms = ["NGPC"], saves = ["Beetle NeoPop"] }
neogeoaes = { roms = ["NEOGEO"], saves = ["FinalBurn Neo", "FB Alpha 2012"], bios = ["{bios}/{name}", "{bios}/{rel}"] }
neogeomvs = { roms = ["NEOGEO"], saves = ["FinalBurn Neo", "FB Alpha 2012"], bios = ["{bios}/{name}", "{bios}/{rel}"] }
nes = { roms = ["NES", "FC", "FAMICOM"], saves = ["FCEUmm"] }
pc-9800-series = { roms = ["PC98"], saves = ["Neko Project II kai"] }
pico-8 = { roms = ["PICO8"], saves = ["fake-08"] }
pokemon-mini = { roms = ["POKEMINI"], saves = ["PokeMini"] }
ports = { roms = ["PORTS"], saves = [] }
psp = { roms = ["PSP"], saves = [] }
psx = { roms = ["PSX", "PS", "PS1"], saves = ["PCSX-ReARMed", "SwanStation"] }
saturn = { roms = ["SATURN"], saves = ["YabaSanshiro"], bios = ["{bios}/SATURN/{name}", "{bios}/{rel}"] }
sega32 = { roms = ["32X", "SEGA32X", "MD32X"], saves = ["PicoDrive"] }
segacd = { roms = ["SEGACD", "MEGACD"], saves = ["Genesis Plus GX", "PicoDrive"] }
sfam = { roms = ["SNES", "SFC"], saves = ["Snes9x"] }
sgb = { roms = ["GB"], saves = ["Gambatte", "mGBA"] }
sms = { roms = ["MS", "SMS"], saves = ["Genesis Plus GX", "PicoDrive"] }
snes = { roms = ["SNES", "SFC"], saves = ["Snes9x"] }
tg16 = { roms = ["PCE", "TG16"], saves = ["Beetle PCE Fast"] }
turbografx-cd = { roms = ["PCECD"], saves = ["Beetle PCE Fast"] }
vectrex = { roms = ["VECTREX"], saves = [] }
virtualboy = { roms = ["VB"], saves = [] }
wonderswan = { roms = ["WS"], saves = ["Beetle WonderSwan"] }
wonderswan-color = { roms = ["WSC"], saves = ["Beetle WonderSwan"] }

[devices]
default = "mlp1"

[devices.inputs]
mlp1 = "mlp1.json"

[packaging]
asset = "Grout-Leaf.zip"
launch_script = "Grout.pak/launch.sh"
install_depth = 2
files = ["launch.sh", "pak.json", "icon.png"]
