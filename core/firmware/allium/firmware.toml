id = "allium"
name = "Allium"
maintained = "upstream"
upstream = { repo = "github.com/goweiwen/Allium", ref = "v1.0.2" }

[version]
file = { value = "{card}/.allium/version.txt", src = "Makefile" }

[paths]
card = { value = "/mnt/SDCARD", src = "crates/common/src/constants.rs" }
roms = { value = "{card}/Roms", src = "crates/common/src/constants.rs" }
bios = { value = "{card}/BIOS", src = "migrations/0001-retroarch-core-overrides/retroarch-core-overrides/REminiscence/retroarch_flashback.cfg" }
saves = { value = "{card}/Saves/CurrentProfile/saves", src = "migrations/0001-retroarch-core-overrides/retroarch-core-overrides/REminiscence/retroarch_flashback.cfg" }

[rom_folders]
style = { value = "plain", src = "crates/allium-launcher/src/consoles.rs" }

[saves]
layout = { value = "per-emulator", src = "migrations/0001-retroarch-core-overrides/retroarch-core-overrides/REminiscence/retroarch_flashback.cfg" }
naming = { value = "retroarch", src = "migrations/0001-retroarch-core-overrides/retroarch-core-overrides/REminiscence/retroarch_flashback.cfg" }

[bios]
default = { value = ["{bios}/{rel}"], src = "migrations/0001-retroarch-core-overrides/retroarch-core-overrides/REminiscence/retroarch_flashback.cfg" }

[art]
naming = "plain"
cover = { value = "{rom_dir}/Imgs", src = "crates/allium-launcher/src/entry/lazy_image.rs" }

[gamelist]
format = "miyoo"

[retroarch]
config = { value = "{card}/RetroArch/.retroarch/retroarch.cfg", src = "static/.allium/cores/retroarch/launch_without_savestate_auto_load.sh" }
overrides = { value = "{card}/Saves/CurrentProfile/config", src = "static/.allium/migrations/0001-retroarch-core-overrides/run.sh" }

[platform_sources]
roms = "static/.allium/config/consoles.toml"
saves = "migrations/0001-retroarch-core-overrides/retroarch-core-overrides"

