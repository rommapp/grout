id = "onion"
name = "Onion"
maintained = "upstream"
upstream = { repo = "github.com/OnionUI/Onion", ref = "v4.3.1-1" }

[version]
file = { value = "{card}/.tmp_update/onionVersion/version.txt", src = "Makefile" }

[paths]
card = { value = "/mnt/SDCARD", src = "src/common/system/settings.h" }
roms = { value = "{card}/Roms", src = "src/playActivity/playActivityDB.h" }
bios = { value = "{card}/BIOS", src = "static/configs/RetroArch/.retroarch/retroarch.cfg" }
saves = { value = "{card}/Saves/CurrentProfile/saves", src = "static/configs/RetroArch/.retroarch/retroarch.cfg" }

[rom_folders]
style = { value = "plain", src = "static/packages/Emu/Nintendo - GBA (mGBA)/Emu/GBA/config.json" }

[saves]
layout = { value = "per-emulator", src = "static/configs/RetroArch/.retroarch/retroarch.cfg" }
naming = { value = "retroarch", src = "static/configs/RetroArch/.retroarch/retroarch.cfg" }

[bios]
default = { value = ["{bios}/{rel}"], src = "static/configs/RetroArch/.retroarch/retroarch.cfg" }

[art]
naming = "plain"
cover = { value = "{rom_dir}/Imgs", src = "static/packages/Emu/Nintendo - GBA (mGBA)/Emu/GBA/config.json" }

[gamelist]
format = "miyoo"

[retroarch]
config = { value = "{card}/RetroArch/.retroarch/retroarch.cfg", src = "src/common/system/settings.h" }
overrides = { value = "{card}/Saves/CurrentProfile/config", src = "static/configs/RetroArch/.retroarch/retroarch.cfg" }

[platform_sources]
roms = "static/packages"
saves = "static/configs/Saves/CurrentProfile/config"

[platforms]
"3do" = { roms = ["PANASONIC"], saves = ["Opera"] }
