id = "muos"
name = "muOS"
maintained = "upstream"
upstream = { repo = "github.com/MustardOS/internal", ref = "2606.0_Andromeda" }

[version]
file = { value = "/opt/muos/config/system/version", src = "config/system/version" }

[paths]
card = { value = "/run/muos/storage", src = "script/var/base.sh" }
roms = { hook = "muos_rom_root" }
bios = { value = "{card}/bios", src = "share/emulator/retroarch/retroarch.default.cfg" }
saves = { value = "{card}/save", src = "script/device/bind.sh" }

[rom_folders]
style = { value = "plain", src = "script/system/assign.sh" }

[saves]
layout = { value = "per-emulator", src = "share/emulator/retroarch/retroarch.default.cfg" }
naming = { value = "retroarch", src = "share/emulator/retroarch/retroarch.default.cfg" }
extra_folders_hook = "muos_pickles"
label_hook = "muos_label"

[bios]
default = { value = ["{bios}/{rel}"], src = "share/emulator/retroarch/retroarch.default.cfg" }

[art]
naming = "plain"
cover = { value = "{card}/info/catalogue/{system}/box", src = "script/system/catalogue.sh" }
preview = { value = "{card}/info/catalogue/{system}/preview", src = "script/system/catalogue.sh" }
splash = { value = "{card}/info/catalogue/{system}/splash", src = "script/system/catalogue.sh" }

[gamelist]
format = "muos-text"

[retroarch]
config = { value = "/opt/muos/share/info/config/retroarch.cfg", src = "script/var/retro.sh" }
overrides = { value = "/opt/muos/share/info/config", src = "share/emulator/retroarch/retroarch.default.cfg" }

[platform_sources]
roms = "share/info/manifest/core.json"
saves = "share/emulator/retroarch/info"

