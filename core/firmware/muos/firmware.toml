[devices]
default = "anbernic"
rules = [
  { device = "trimui-smart-pro", file = "/proc/bus/input/devices", contains = "TRIMUI Smart Pro" },
  { device = "trimui", file = "/proc/bus/input/devices", contains = "TRIMUI" },
]

[devices.inputs]
trimui-smart-pro = "trimui-smart-pro.json"
trimui = "trimui.json"
anbernic = { hook = "muos_sdl_map_input" }

[packaging]
asset = "Grout.muxapp"
launch_script = "Grout/mux_launch.sh"
install_depth = 2
files = ["mux_launch.sh", "mux_lang.ini", "glyph/grout.svg"]
