id = "nextui"
name = "NextUI"
maintained = "upstream"
upstream = { repo = "github.com/LoveRetro/NextUI", ref = "v6.15.0" }

[version]
file = { value = "{card}/.system/version.txt", src = "makefile" }

[paths]
card = { value = "/mnt/SDCARD", src = "workspace/tg5040/platform/platform.h" }
roms = { value = "{card}/Roms", src = "workspace/all/common/defines.h" }
bios = { value = "{card}/Bios", src = "workspace/all/minarch/ma_core.c" }
saves = { value = "{card}/Saves", src = "workspace/all/minarch/ma_core.c" }

[rom_folders]
style = { value = "tagged", src = "workspace/all/common/utils.c" }

[saves]
layout = { value = "per-emulator", src = "workspace/all/minarch/ma_core.c" }
naming = { value = "keep-rom-ext", src = "workspace/all/minarch/ma_saves.c" }
naming_hook = "nextui_save_format"

[bios]
default = { value = ["{bios}/{save_folder}/{name}"], src = "workspace/all/minarch/ma_core.c" }

[art]
naming = "plain"
cover = { value = "{rom_dir}/.media", src = "workspace/all/nextui/nextui.c" }

[gamelist]
format = "none"

[platform_sources]
roms = "skeleton/EXTRAS/Roms"
saves = "skeleton/EXTRAS/Saves"

[platforms]
acpc = { roms = ["Amstrad CPC (CPC)"], saves = ["CPC"] }
amiga = { roms = ["Amiga (PUAE)"], saves = ["PUAE"] }
arcade = { roms = ["Arcade (FBN)"], saves = ["FBN"] }
atari2600 = { roms = ["Atari 2600 (A2600)"], saves = ["A2600"] }
atari5200 = { roms = ["Atari 5200 (A5200)"], saves = ["A5200"] }
atari7800 = { roms = ["Atari 7800 (A7800)"], saves = ["A7800"] }
c-plus-4 = { roms = ["Commodore Plus4 (PLUS4)"], saves = ["PLUS4"] }
c128 = { roms = ["Commodore 128 (C128)"], saves = ["C128"] }
c64 = { roms = ["Commodore 64 (C64)"], saves = ["C64"] }
colecovision = { roms = ["Colecovision (COLECO)"], saves = ["COLECO"] }
cpet = { roms = ["Commodore PET (PET)"], saves = ["PET"] }
doom = { roms = ["Doom (PRBOOM)"], saves = ["PRBOOM"] }
famicom = { roms = ["Nintendo Entertainment System (FC)"], saves = ["FC"] }
fds = { roms = ["Famicom Disk System (FDS)"], saves = ["FDS"] }
gamegear = { roms = ["Sega Game Gear (GG)"], saves = ["GG"] }
gb = { roms = ["Game Boy (GB)"], saves = ["GB"] }
gba = { roms = ["Game Boy Advance (GBA)", "Game Boy Advance (MGBA)"], saves = ["GBA", "MGBA"] }
gbc = { roms = ["Game Boy Color (GBC)"], saves = ["GBC"] }
genesis = { roms = ["Sega Genesis (MD)"], saves = ["MD"] }
lynx = { roms = ["Atari Lynx (LYNX)"], saves = ["LYNX"] }
msx = { roms = ["Microsoft MSX (MSX)"], saves = ["MSX"] }
neo-geo-pocket = { roms = ["Neo Geo Pocket (NGP)"], saves = ["NGP"] }
neo-geo-pocket-color = { roms = ["Neo Geo Pocket Color (NGPC)"], saves = ["NGPC"] }
nes = { roms = ["Nintendo Entertainment System (FC)"], saves = ["FC"] }
pico = { roms = ["Pico-8 (P8)"], saves = ["P8"] }
pico-8 = { roms = ["Pico-8 (P8)"], saves = ["P8"] }
pokemon-mini = { roms = ["Pokémon mini (PKM)"], saves = ["PKM"] }
psx = { roms = ["Sony PlayStation (PS)"], saves = ["PS"] }
sega32 = { roms = ["Sega 32X (32X)"], saves = ["32X"] }
segacd = { roms = ["Sega CD (SEGACD)"], saves = ["SEGACD"] }
sfam = { roms = ["Super Nintendo Entertainment System (SFC)", "Super Nintendo Entertainment System (SUPA)"], saves = ["SFC", "SUPA"] }
sg1000 = { roms = ["Sega SG-1000 (SG1000)"], saves = ["SG1000"] }
sgb = { roms = ["Super Game Boy (SGB)"], saves = ["SGB"] }
sms = { roms = ["Sega Master System (SMS)"], saves = ["SMS"] }
snes = { roms = ["Super Nintendo Entertainment System (SFC)", "Super Nintendo Entertainment System (SUPA)"], saves = ["SFC", "SUPA"] }
tg16 = { roms = ["TurboGrafx-16 (PCE)"], saves = ["PCE"] }
vic-20 = { roms = ["Commodore VIC20 (VIC)"], saves = ["VIC"] }
virtualboy = { roms = ["Virtual Boy (VB)"], saves = ["VB"] }

[devices]
default = "generic"
rules = [
  { device = "trimui", env = "NEXTUI_DEVICE", equals = "tg5040" },
  { device = "trimui", env = "NEXTUI_DEVICE", equals = "tg5050" },
  { device = "miyooflip", env = "NEXTUI_DEVICE", equals = "my355" },
]

[devices.quirks]
miyooflip = { disable_keyboard_joystick = true }

[packaging]
asset = "Grout.pak.zip"
launch_script = "launch.sh"
install_depth = 1
files = ["launch.sh"]
