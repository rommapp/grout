[devices]
default = "generic"
rules = [
  { device = "trimui", env = "NEXTUI_DEVICE", equals = "tg5040" },
  { device = "trimui", env = "NEXTUI_DEVICE", equals = "tg5050" },
  { device = "miyooflip", env = "NEXTUI_DEVICE", equals = "my355" },
]

[devices.quirks]
miyooflip = { disable_keyboard_joystick = true }

[packaging]
asset = "Grout.pak.zip"
launch_script = "launch.sh"
install_depth = 1
files = ["launch.sh"]
